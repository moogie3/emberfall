# ── General Settings ───────────────────────────────────────────
general {
    no_fade_in = false
    grace = 0
    disable_loading = true
    hide_cursor = true
}

# ── Background (Reduced Blur) ──────────────────────────────────
background {
    monitor =
    path = /home/emberfall/Pictures/Background/background.jpg
    color = rgba(30, 30, 30, 1.0) 
    blur_passes = 1    # Reduced from 4 for more color clarity
    blur_size = 4      # Reduced from 10
    brightness = 0.5   # Slightly brighter to see the gray better
    contrast = 1.0
}

# ── Time ───────────────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 64 
    font_family = FOT-Rodin Pro DB
    position = 0, 230
    halign = center
    valign = center
}

# ── Date + Year ────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +'%A, %d %B %Y')</span>"
    color = rgba(255, 255, 255, 0.6)
    font_size = 14 
    font_family = FOT-Rodin Pro DB
    position = 0, 170 
    halign = center
    valign = center
}

# ── User Image ─────────────────────────────────────────────────
image {
    monitor =
    path = /home/moogie3/Downloads/images.png
    size = 38 
    rounding = -1 
    border_size = 1
    border_color = rgba(255, 255, 255, 0.1)
    position = 0, -200
    halign = center
    valign = center
}

# ── Input Field ────────────────────────────────────────────────
input-field {
    monitor =
    size = 150, 30 
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(255, 255, 255, 0.05)
    font_color = rgb(255, 255, 255)
    
    fade_on_empty = true 
    placeholder_text = 
    
    hide_input = false
    rounding = 8
    position = 0, -250
    halign = center
    valign = center
}