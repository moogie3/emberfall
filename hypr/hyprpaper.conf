# General settings
ipc = on
splash = false

# Preload is still needed for caching
preload = /home/emberfall/Pictures/Background/background.jpg

# The NEW block syntax
wallpaper {
    monitor = eDP-1
    path = /home/emberfall/Pictures/Background/background.jpg
    # Options: cover, contain, stretch, center
    fit_mode = cover 
}

# Add another block if you have HDMI-A-1
wallpaper {
    monitor = HDMI-A-1
    path = /home/emberfall/Pictures/Background/background.jpg
    fit_mode = cover
}
